# Once a month, on the 1st: ubuntu:26.04 and its packages change without a commit here. The image is
# rebuilt from scratch, tested and republished, so :latest and :26.04 pick up 26.04's security updates
# even when nothing is pushed for months. (The downloads that the install scripts fetch are checked by
# ubuntu-desktop's monthly.yml: its Tor Browser and DeaDBeeF installers are the same files as these.)
#
# GitHub pauses scheduled workflows in a public repo after 60 days without activity, and
# scheduled runs do not count. After a quiet spell like that:
#   gh workflow enable monthly.yml          (any push also resets the clock)
#
# By hand, from master (on any other branch the job is skipped):
#   gh workflow run monthly.yml                   test only, pushes nothing
#   gh workflow run monthly.yml -f publish=true   test and publish
name: monthly

on:
  schedule:
    - cron: "37 6 1 * *"      # the 1st of every month, 06:37 UTC
  workflow_dispatch:
    inputs:
      publish:
        description: Push the rebuilt image to ghcr.io as :latest, :26.04 and :monthly-YYYYMMDD
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    name: Rebuild, test and publish the image
    # Only from master: the schedule already runs only there, and this also
    # skips a run started by hand on any other branch
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TEST_TAG: ubuntu-desktop-xfce:monthly-test
      # Scheduled runs publish; a manual run only with -f publish=true
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/fullaxx/ubuntu-desktop-xfce
          tags: |
            type=raw,value=latest
            type=raw,value=26.04
            type=raw,value=monthly-{{date 'YYYYMMDD'}}

      # A fresh base and no cache: the point is today's 26.04 packages
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          no-cache: true
          load: true
          tags: ${{ env.TEST_TAG }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Check the desktop comes up
        run: tests/desktop.sh "${TEST_TAG}"

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same build again: every layer comes from the build above,
      # so this pushes exactly the image that was just tested
      - name: Push the image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
