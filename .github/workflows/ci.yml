# Builds the image and pushes it to ghcr.io/fullaxx/ubuntu-desktop-xfce (the README's docker pull):
# every push to master publishes :latest and :master-<short sha>. "Run workflow" in the Actions tab
# does the same by hand. Same actions and tags as ubuntu-desktop's ci.yml.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-24.04

    # GITHUB_TOKEN is read-only by default in this repo; pushing to ghcr.io needs packages: write
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest from master (the default branch), plus master-<short sha> for each build
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/fullaxx/ubuntu-desktop-xfce
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-

      # The GitHub Actions cache keeps unchanged layers between pushes
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
